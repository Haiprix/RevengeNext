name: Build & Publish Plugins

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: oven-sh/setup-bun@v2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Android SDK
        id: cache-android
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-37.0.0-bt36-1-bt37-1

      - name: Setup Android SDK
        if: steps.cache-android.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/android-sdk/platforms /opt/android-sdk/build-tools
          sudo chown -R $USER /opt/android-sdk
          cd /tmp
          wget -q https://dl.google.com/android/repository/platform-37.0_r02.zip
          wget -q https://dl.google.com/android/repository/build-tools_r36_linux.zip
          wget -q https://dl.google.com/android/repository/build-tools_r37_linux.zip
          unzip -q platform-37.0_r02.zip -d /opt/android-sdk/platforms
          unzip -q build-tools_r36_linux.zip -d /opt/android-sdk/build-tools
          unzip -q build-tools_r37_linux.zip -d /opt/android-sdk/build-tools
          mv /opt/android-sdk/build-tools/android-16 /opt/android-sdk/build-tools/36.0.0
          mv /opt/android-sdk/build-tools/android-37.0 /opt/android-sdk/build-tools/37.0.0

      l- name: Accept licenses & set env
        run: |
          sudo mkdir -p /opt/android-sdk/licenses
          sudo chown -R $USER /opt/android-sdk
          echo '24333f8a63b6825ea9c5514f83c2829b004d1fee' > /opt/android-sdk/licenses/android-sdk-license
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          
      - name: Clone revenge-xposed
        run: git clone --depth 1 https://github.com/revenge-mod/revenge-xposed.git

      - name: Install dependencies & build plugin-cli
        run: |
          bun install
          cd node_modules/@revenge-mod/plugin-cli
          bun run build

      - name: Publish revenge-api to Maven Local
        run: |
          cd revenge-xposed
          chmod +x gradlew
          ./gradlew :api:publishToMavenLocal --no-daemon

      - name: Inject message-tweaks passkey
        env:
          MESSAGE_TWEAKS_PASSKEY: ${{ secrets.MESSAGE_TWEAKS_PASSKEY }}
        run: |
          if [ -n "$MESSAGE_TWEAKS_PASSKEY" ]; then
            HASH=$(printf '%s' "$MESSAGE_TWEAKS_PASSKEY" | sha256sum | cut -d' ' -f1)
          else
            HASH=""
          fi
          mkdir -p plugins/message-tweaks
          cat > plugins/message-tweaks/secret.ts <<EOF
          export default {
              passkeyHash: '$HASH',
          }
          EOF

      - name: Build plugins
        run: bun run release --base-url "https://YOU.github.io/REPO"

      - name: Deploy to gh-pages branch
        run: |
          mkdir -p /tmp/ghpages &&